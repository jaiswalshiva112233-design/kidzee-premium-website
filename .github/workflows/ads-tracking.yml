name: Ads tracking verification
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DIRECT_URL: postgresql://test:test@127.0.0.1:5432/test
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm ci --prefix functions --ignore-scripts --no-audit --no-fund
      - run: npx prisma generate
      - run: npm run typecheck
      - name: Conversion, consent and reporting regression tests
        run: >-
          node --test tests/advanced-consent-mode.test.mjs
          tests/conversion-accuracy.test.mjs tests/conversion-recovery.test.mjs tests/phone-forwarding.test.mjs
          tests/audit-behavioural-regression.test.mjs tests/google-ads-snapshot.test.mjs
          tests/google-ads-snapshot-route.test.mjs tests/google-ads-sheet-webhook.test.mjs
          tests/marketing-dashboard-accuracy.test.mjs tests/marketing-safety-separation.test.mjs
          tests/phase1-production.test.mjs tests/marketing-catalogue-polish.test.mjs
      - name: Install browser verification tools
        run: |
          npm install --prefix "$RUNNER_TEMP/admissions-browser-tools" --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.56.1
          "$RUNNER_TEMP/admissions-browser-tools/node_modules/.bin/playwright" install --with-deps chromium
      - name: Production build and admissions browser verification against an isolated database
        env:
          ADMISSIONS_BROWSER_CHECK: "true"
          ADMISSIONS_PLAYWRIGHT_MODULE: ${{ runner.temp }}/admissions-browser-tools/node_modules/playwright/index.mjs
        run: npm run test:build:production
      - name: Save admissions screenshots and verification results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admissions-2027-28-browser-review
          path: work/admissions-browser
          if-no-files-found: ignore

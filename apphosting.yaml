runConfig:
  cpu: 1
  memoryMiB: 512
  minInstances: 0
  maxInstances: 3
  concurrency: 80

env:
  - variable: NODE_ENV
    value: production
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_SITE_URL
    value: https://kidzeedwarka.com
    availability: [BUILD, RUNTIME]
  - variable: CENTREOS_BASE_URL
    value: https://kidzeedwarka.com
    availability: [RUNTIME]

  - variable: DATABASE_URL
    secret: DATABASE_URL
    availability: [BUILD, RUNTIME]
  - variable: DIRECT_URL
    secret: DIRECT_URL
    availability: [BUILD, RUNTIME]

  - variable: ADMIN_SESSION_SECRET
    secret: ADMIN_SESSION_SECRET
    availability: [RUNTIME]
  - variable: INTERNAL_DEVICE_SECRET
    secret: INTERNAL_DEVICE_SECRET
    availability: [RUNTIME]
  - variable: ADMIN_PANEL_PASSWORD
    secret: ADMIN_PANEL_PASSWORD
    availability: [RUNTIME]
  - variable: ADMIN_OWNER_EMAIL
    secret: ADMIN_OWNER_EMAIL
    availability: [RUNTIME]
  - variable: ADMIN_OWNER_NAME
    secret: ADMIN_OWNER_NAME
    availability: [RUNTIME]

  - variable: NEXT_PUBLIC_SANITY_PROJECT_ID
    value: 4pj1t073
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_SANITY_DATASET
    value: production
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_SANITY_API_VERSION
    value: 2026-08-01
    availability: [BUILD, RUNTIME]
  - variable: SANITY_API_WRITE_TOKEN
    secret: SANITY_API_WRITE_TOKEN
    availability: [RUNTIME]

  - variable: FIREBASE_PROJECT_ID
    value: kidzee-dwarka-centreos
    availability: [BUILD, RUNTIME]
  - variable: FIREBASE_STORAGE_BUCKET
    value: kidzee-dwarka-centreos.firebasestorage.app
    availability: [RUNTIME]
  - variable: FIREBASE_DATABASE_ID
    value: default
    availability: [RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyDN3M6nHZ5SPxPEQzowitu4XrxLTAtDupc
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: kidzee-dwarka-centreos.firebaseapp.com
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "767637423447"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: 1:767637423447:web:0eda73aab590febccc2a12
    availability: [BUILD, RUNTIME]
  - variable: FIREBASE_AUTH_ENABLED
    value: "false"
    availability: [RUNTIME]

  - variable: BILLING_CRON_SECRET
    secret: BILLING_CRON_SECRET
    availability: [RUNTIME]

  # Trial launch: provider integrations stay disabled until the Owner completes
  # their production credentials and separately approves activation.
  - variable: WEBSITE_ANALYTICS_ENABLED
    value: "false"
    availability: [BUILD, RUNTIME]
  - variable: WEBSITE_ADVERTISING_ENABLED
    value: "false"
    availability: [BUILD, RUNTIME]
  - variable: WEBSITE_META_PIXEL_ENABLED
    value: "false"
    availability: [BUILD, RUNTIME]
